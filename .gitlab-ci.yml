stages:
  - build

kernel-build:
  stage: build
  image: ubuntu:22.04
  only:
    - air-5.15
  variables:
    TOKEN: $GIT_TOKEN
  before_script:
    - apt-get update -y
    - apt-get install -y curl git gnupg
    - git config --global user.name "Koushikdey2003"
    - git config --global user.email "kousickdey3@gmail.com"

  script:
    # Initialize environment
    - |
      df -h
      ld --version
      gcc -v
      ar --version
      apt-get install -y bc bison build-essential ccache curl flex glibc-source g++-multilib gcc-multilib binutils-aarch64-linux-gnu git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1 liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
      apt-get install repo -y
      repo --version
      apt-get install neofetch -y
      neofetch
      df -h
      ccache -M 100G
      export USE_CCACHE=1
      ccache --show-stats

    # Compile kernel
    - |
      mkdir kernel
      cd kernel
      repo init -u https://github.com/Koushikdey2003/kernel_manifest-air-5.15.git -b common-android13-5.15 --depth=1
      repo sync --force-sync
      echo "Compile starting..."
      BUILD_CONFIG=kernel-5.15/build.config.mtk.aarch64.mgk build/build.sh
      echo "Compiled..."
      ccache --show-stats
      ccache --show-config
      ls out/android13-5.15/dist > list.txt
      git clone https://github.com/Koushikdey2003/AnyKernel3 -b air --depth=1
      cp -r out/android13-5.15/dist/Image.gz AnyKernel3
      cd AnyKernel3
      zip -r9 android13-5.15-AnyKernel3.zip ./*

  artifacts:
    name: "android13-5.15-artifacts"
    paths:
      - kernel/AnyKernel3/android13-5.15-AnyKernel3.zip
      - kernel/out/android13-5.15/dist/Image.gz
      - kernel/out/android13-5.15/dist/mt6835.dtb
      - kernel/list.txt
    expire_in: 30 days

